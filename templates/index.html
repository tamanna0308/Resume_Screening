<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>AI Resume Screening System</title>

    <!-- Link CSS File -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Main Container -->
    <div class="container">

        <h1>AI Resume Screening & Job Recommendation</h1>

        <p>
            Upload your resume in PDF format and check how well it matches
            the Job Description using Artificial Intelligence.
        </p>

        <!-- Resume Upload Form -->
        <form action="/predict" method="POST" enctype="multipart/form-data">

            <label>Select Resume (PDF)</label>

            <input
                type="file"
                name="resume"
                accept=".pdf"
                required>

            <br><br>

            <button type="submit">
                Check Resume Score
            </button>

        </form>

    </div>

</body>

</html>
